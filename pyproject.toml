[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-agent"
version = "0.1.0"
description = "Screenshot Scene-Description Agent: captures a screenshot, describes it with a vision LLM, and brands it with a logo and caption."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "playwright>=1.42",
    "Pillow>=10.2",
    "tenacity>=8.2",
    "anthropic>=0.34",
    "openai>=1.30",
    "mss>=9.0; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[project.scripts]
scene-agent = "scene_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
